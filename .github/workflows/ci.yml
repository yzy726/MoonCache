name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, js, wasm-gc]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - name: Formatting
        run: moon fmt --check
      - name: Check
        run: moon check --target "${{ matrix.target }}" --deny-warn
      - name: Test
        run: moon test --target "${{ matrix.target }}" --deny-warn

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Generate interfaces
        run: moon info
      - name: Verify generated files
        run: git diff --exit-code
