name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, js, wasm-gc]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.1.20260729
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain
        run: moon version --all
      - name: Update package registry
        run: moon update
      - name: Formatting
        run: moon fmt --check
      - name: Check
        run: moon check --target "${{ matrix.target }}" --deny-warn
      - name: Test
        run: moon test --target "${{ matrix.target }}" --deny-warn

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.1.20260729
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update package registry
        run: moon update
      - name: Generate interfaces
        run: moon info
      - name: Verify generated files
        run: git diff --exit-code

  final-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.1.20260729
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update package registry
        run: moon update
      - name: CLI scenario smoke
        run: |
          moon run cmd/main -- validate examples/scenarios/basic-cache.json
          moon run cmd/main -- explain examples/scenarios/stale-etag.json --json
      - name: Scenario corpus replay (250+ floor)
        run: |
          moon run cmd/main -- replay testdata/scenarios | tail -n 1
          moon run cmd/main -- replay testdata/compat
      - name: Store command smoke
        run: |
          STORE=.cache-smoke
          rm -rf "$STORE"
          moon run cmd/main -- stats --store "$STORE" --json > /tmp/smoke_stats.json
          grep -q '"entries": 0' /tmp/smoke_stats.json
          moon run cmd/main -- inspect --store "$STORE" | grep -q "Cached URIs: 0"
          moon run cmd/main -- purge --store "$STORE" --uri https://example.test/none | grep -q "Purged 0 entries"
          moon run cmd/main -- verify --store "$STORE" | grep -q "Status: OK"
          moon run cmd/main -- clean --store "$STORE" | grep -q "Quarantined files purged: 0"
      - name: Demo proxy argument validation
        run: |
          # Positive-path serve/proxy behavior is covered by the async
          # integration test in the core job; here we only pin the CLI
          # contract that a missing --upstream must fail with exit code 2.
          if moon run cmd/main -- serve --listen 127.0.0.1:8080 > /dev/null 2>&1; then
            echo "serve must reject missing --upstream"
            exit 1
          fi
      - name: Runnable examples
        run: |
          moon run examples/basic_cache
          moon run examples/vary_language
          moon run examples/etag_revalidation
          moon run examples/shared_private
          moon run examples/demo_proxy
      - name: Benchmarks
        run: moon bench
