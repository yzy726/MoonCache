name: Bug report
description: Report a deterministic MoonCache behavior or implementation bug.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the action, reason code, and trace with secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Cite an RFC section when the expectation is protocol-driven.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Deterministic reproduction
      description: Provide metadata, injected timestamps, target, and commands.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MoonCache and MoonBit versions
    validations:
      required: true
